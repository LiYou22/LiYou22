<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale Run</title>
<style>
  :root { --bg: #ffffff; --fg: #2e7de9; --muted: #7aa2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #7aa2f7; --muted: #565f89; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
         font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
  canvas { width: min(900px, calc(100vw - 32px)); aspect-ratio: 900 / 180; image-rendering: pixelated;
           touch-action: none; cursor: pointer; }
  a { color: var(--fg); }
</style>
</head>
<body>
<canvas id="game" aria-label="Whale Run: hold space, click or touch to swim up; avoid kelp, rocks and jellyfish"></canvas>
<div>hold <b>space</b> / click / touch to swim up · <a href="https://github.com/LiYou22">github.com/LiYou22</a></div>
<script src="sprites.js"></script>
<script>
(() => {
  const S = window.SPRITES;
  const W = 900, H = 180, PX = 4, SURFACE = 44, SEABED = 160;
  const WHALE_X = 90, WHALE_W = S.whale[0][0].length * PX, WHALE_H = S.whale[0].length * PX;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dark = matchMedia("(prefers-color-scheme: dark)");

  function fit() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  fit();
  addEventListener("resize", fit);

  const palette = () => S.themes[dark.matches ? "dark" : "light"];

  function bitmap(rows, x, y, s, color) {
    ctx.fillStyle = color;
    rows.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        if (row[c] === "#") ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s);
      }
    });
  }
  function text(str, x, y, s, color) {
    [...str].forEach((ch, i) => bitmap(S.font[ch] || S.font[" "], x + i * 6 * s, y, s, color));
  }
  const textWidth = (str, s) => str.length * 6 * s - s;

  // Kelp of any height: the banner sprite's 4-row sway pattern repeated, then its 2-row base.
  function kelpRows(frame, rows) {
    const k = S.kelp[frame];
    return Array.from({ length: rows - 2 }, (_, i) => k[i % 4]).concat(k.slice(-2));
  }

  let hi = 0;
  try { hi = +localStorage.getItem("whale-hi") || 0; } catch (e) {}

  let state, whale, obstacles, speed, distance, nextGap, scroll, clock, overAt;
  function reset() {
    state = "ready";
    whale = { y: 84, vy: 0 };
    obstacles = [];
    speed = 220;
    distance = 0;
    nextGap = 300;
    scroll = 0;
    clock = 0;
  }
  reset();

  let holding = false;
  function press() {
    holding = true;
    if (state === "ready") state = "playing";
    else if (state === "over" && clock - overAt > 0.5) { reset(); state = "playing"; }
  }
  const release = () => { holding = false; };
  addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (!e.repeat) press(); }
  });
  addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp") release(); });
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);

  function spawn() {
    const kind = ["kelp", "kelp", "jelly", "rock"][Math.floor(Math.random() * 4)];
    if (kind === "kelp") {
      const rows = 8 + Math.floor(Math.random() * 9);
      obstacles.push({ kind, x: W + 10, rows, w: 4 * PX, h: rows * PX, y: SEABED - rows * PX });
    } else if (kind === "jelly") {
      const base = SURFACE + 4 + Math.random() * 34;
      obstacles.push({ kind, x: W + 10, base, w: 8 * PX, h: 6 * PX, y: base, phase: Math.random() * 6 });
    } else {
      obstacles.push({ kind, x: W + 10, w: 6 * PX, h: 4 * PX, y: SEABED - 4 * PX });
    }
    nextGap = 170 + Math.random() * 230 + speed * 0.35;
  }

  const hit = (o) =>
    WHALE_X + 10 < o.x + o.w - 2 && WHALE_X + WHALE_W - 6 > o.x + 2 &&
    whale.y + 8 < o.y + o.h - 2 && whale.y + WHALE_H - 6 > o.y + 2;

  function update(dt) {
    clock += dt;
    if (state !== "playing") return;
    speed = Math.min(520, speed + 6 * dt);
    const step = speed * dt;
    distance += step;
    scroll = (scroll + step) % W;
    whale.vy += (holding ? -900 : 520) * dt;
    whale.vy = Math.max(-260, Math.min(240, whale.vy));
    whale.y += whale.vy * dt;
    const top = SURFACE + 2, bottom = SEABED - WHALE_H + 6;
    if (whale.y < top) { whale.y = top; whale.vy = 0; }
    if (whale.y > bottom) { whale.y = bottom; whale.vy = 0; }

    nextGap -= step;
    if (nextGap <= 0) spawn();
    for (const o of obstacles) {
      o.x -= step;
      if (o.kind === "jelly") o.y = o.base + Math.sin(clock * 3 + o.phase) * 6;
    }
    obstacles = obstacles.filter((o) => o.x + o.w > -20);
    if (obstacles.some(hit)) {
      state = "over";
      overAt = clock;
      const score = Math.floor(distance / 10);
      if (score > hi) {
        hi = score;
        try { localStorage.setItem("whale-hi", String(hi)); } catch (e) {}
      }
    }
  }

  function draw() {
    const p = palette();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = p.water;
    ctx.fillRect(0, SURFACE, W, SEABED - SURFACE);

    // clouds drift only through the middle of the sky so they never cross the score
    ctx.save();
    ctx.beginPath();
    ctx.rect(20, 0, W - 380, SURFACE);
    ctx.clip();
    const cloudShift = (scroll / 12) % W;
    for (const [cx, cy] of [[200, 10], [470, 22], [760, 14]]) {
      bitmap(S.cloud, ((cx - cloudShift) % W + W) % W, cy, 2, p.soft);
    }
    ctx.restore();
    if (dark.matches) bitmap(S.moon, 330, 10, 3, p.fg);

    const score = String(Math.floor(distance / 10) % 100000).padStart(5, "0");
    const board = `HI ${String(hi % 100000).padStart(5, "0")} `;
    const bx = W - 20 - textWidth(board + score, 3);
    text(board, bx, 12, 3, p.muted);
    text(score, bx + board.length * 18, 12, 3, p.fg);

    ctx.fillStyle = p.fg;
    const surf = (scroll / 2) % 24;
    for (let x = -surf; x < W; x += 24) ctx.fillRect(Math.round(x), SURFACE + ((Math.round(x + surf) / 24) % 2 ? 2 : 0), 16, 2);
    ctx.fillRect(0, SEABED, W, 2);
    ctx.fillStyle = p.soft;
    for (let i = 0; i < 26; i++) {
      const x = ((13 + i * 37 - scroll) % W + W) % W;
      ctx.fillRect(Math.round(x), SEABED + 6 + (i * 7) % 12, 4 + (i * 5) % 9, 2);
    }

    const frame = Math.floor(clock / (holding ? 0.15 : 0.3)) % 2;
    for (const o of obstacles) {
      if (o.kind === "kelp") bitmap(kelpRows(frame, o.rows), o.x, o.y, PX, p.fg);
      else if (o.kind === "jelly") bitmap(S.jelly[frame], o.x, o.y, PX, p.fg);
      else bitmap(S.rock, o.x, o.y, PX, p.fg);
    }
    bitmap(S.whale[state === "over" ? 0 : frame], WHALE_X, whale.y, PX, p.fg);

    const banner = (msg, y, color) => text(msg, (W - textWidth(msg, 3)) / 2, y, 3, color);
    if (state === "ready") banner("HOLD SPACE OR TAP TO SWIM", 92, p.fg);
    if (state === "over") {
      banner("GAME OVER", 76, p.fg);
      if (clock - overAt > 0.5) banner("PRESS SPACE OR TAP TO RETRY", 108, p.muted);
    }
  }

  let last = performance.now();
  function loop(now) {
    update(Math.min(0.05, (now - last) / 1000));
    last = now;
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
